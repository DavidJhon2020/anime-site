name: Verify site

on:
  schedule:
    - cron: "25 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned QA dependencies
        run: npm install --no-save --package-lock=false playwright@1.62.1 sharp@0.35.5
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check repository data, DOM and published files
        run: node tools/verify.js --url https://davidjhon2020.github.io/anime-site/
      - name: Open or update the verification issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const title = "定期校验失败：季刊新番";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `定期校验未通过。查看失败步骤与日志：${runUrl}\n\n请先判断是数据完整性、DOM 结构，还是 GitHub Pages 发布内容未同步。修复后重跑 **Verify site** 工作流。`;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const issue = openIssues.find((item) => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
